services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: crypto-market-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:4.0.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic market.trades --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic market.orderbook --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  bybit-collector:
    build:
      context: .
    command:
      - bybit-collector
      - --sink
      - kafka
      - --symbol
      - BTCUSDT
      - --kafka-bootstrap-servers
      - kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  okx-collector:
    build:
      context: .
    command:
      - okx-collector
      - --sink
      - kafka
      - --symbol
      - BTCUSDT
      - --kafka-bootstrap-servers
      - kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: crypto-market-minio
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: crypto-market-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9004:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pipeline}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pipeline}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse-raw-writer:
    build:
      context: .
    command:
      - clickhouse-raw-writer
      - --bootstrap-servers
      - kafka:29092
      - --clickhouse-host
      - clickhouse
      - --clickhouse-port
      - "8123"
      - --clickhouse-user
      - ${CLICKHOUSE_USER:-pipeline}
      - --clickhouse-password
      - ${CLICKHOUSE_PASSWORD:-pipeline}
      - --flush-rows
      - "1000"
      - --flush-interval-seconds
      - "1"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio_data:
  clickhouse_data:
