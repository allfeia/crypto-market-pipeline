[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-market-pipeline"
version = "0.1.0"
description = "Public market-data collectors for Bybit and OKX"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10",
    "clickhouse-connect>=0.8",
    "minio>=7.2",
    "pyarrow>=18.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
market-collector = "crypto_market_pipeline.main:run"
bybit-collector = "crypto_market_pipeline.main:run_bybit"
okx-collector = "crypto_market_pipeline.main:run_okx"
market-archiver = "crypto_market_pipeline.archiver:run"
clickhouse-raw-writer = "crypto_market_pipeline.clickhouse_writer:run"
market-reconcile = "crypto_market_pipeline.reconciler:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
